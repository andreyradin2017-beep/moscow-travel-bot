name: Good Night Message

on:
  schedule:
    - cron: '0 19 * * *'  # 22:00 МСК = 19:00 UTC
  workflow_dispatch:       # для ручного теста

permissions:
  contents: read  # писать не нужно — нет истории

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Send good night
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python good_night.py
