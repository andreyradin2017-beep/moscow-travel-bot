name: Good Night Message

on:
  schedule:
    - cron: '0 19 * * *'  # 22:00 МСК
  workflow_dispatch:

permissions:
  contents: write  # ← нужно для сохранения истории

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Restore night phrase history
        run: |
          if [ -f used_night_phrases.json ]; then
            echo "✅ История ночей загружена."
          else
            echo "[]" > used_night_phrases.json
          fi

      - name: Send good night
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python good_night.py

      - name: Save night phrase history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update used_night_phrases.json"
          file_pattern: used_night_phrases.json
