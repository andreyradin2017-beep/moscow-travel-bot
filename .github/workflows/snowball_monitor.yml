name: Snowball Transactions Monitor

on:
  schedule:
    - cron: '*/10 5-19 * * 1-5'  # Пн–Пт, 8:00–22:30 МСК (каждые 10 минут)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Install Python dependencies
        run: |
          pip install telethon playwright httpx
          playwright install chromium

      - name: Restore transaction history
        run: |
          for f in snowball_*.json; do
            [ -f "$f" ] && echo "✅ $f загружен." || echo "[]" > "$f"
          done

      - name: Check for new transactions
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PACHCA_ACCESS_TOKEN: ${{ secrets.PACHCA_ACCESS_TOKEN }}
          PACHCA_CHAT_ID: ${{ secrets.PACHCA_CHAT_ID }}
        run: python monitor_snowball.py

      - name: Save transaction history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snowball transaction history"
          file_pattern: "snowball_*.json"
          push_options: "--force"
