name: Snowball Transactions Monitor

on:
  schedule:
    - cron: '*/30 5-19 * * 1-5'  # Пн–Пт, 8:00–22:30 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Install Python dependencies
        run: |
          pip install telethon playwright
          playwright install chromium

      - name: Restore transaction history
        run: |
          if [ -f snowball_qzuscipxtn_transactions.json ]; then
            echo "✅ История qzuscipxtn загружена."
          else
            echo "[]" > snowball_qzuscipxtn_transactions.json
          fi
          if [ -f snowball_ukbrjaxjfg_transactions.json ]; then
            echo "✅ История ukbrjaxjfg загружена."
          else
            echo "[]" > snowball_ukbrjaxjfg_transactions.json
          fi

      - name: Check for new transactions
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python monitor_snowball.py

      - name: Save transaction history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snowball transaction history"
          file_pattern: "snowball_*.json"
