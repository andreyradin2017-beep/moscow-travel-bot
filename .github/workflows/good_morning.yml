name: Good Morning Message

on:
  schedule:
    - cron: '30 3 * * *'  # 6:30 МСК = 3:30 UTC
  workflow_dispatch:       # Возможность запустить вручную для теста

permissions:
  contents: write  # Нужно для сохранения used_phrases.json

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Restore phrase history
        run: |
          if [ -f used_phrases.json ]; then
            echo "✅ История фраз загружена."
          else
            echo "[]" > used_phrases.json
          fi

      - name: Send good morning message
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python good_morning.py

      - name: Save phrase history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update used_phrases.json"
          file_pattern: used_phrases.json
