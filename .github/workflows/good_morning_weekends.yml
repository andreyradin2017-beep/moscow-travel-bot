name: Good Morning (Weekends)

on:
  schedule:
    - cron: '0 6 * * 6,0'  # Сб-Вс, 9:00 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Restore phrase history
        run: |
          if [ -f used_phrases.json ]; then
            echo "✅ История загружена."
          else
            echo "[]" > used_phrases.json
          fi

      - name: Send good morning
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python good_morning.py

      - name: Save phrase history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update used_phrases.json (weekends)"
          file_pattern: used_phrases.json
