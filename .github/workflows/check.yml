name: Check Moscow Posts

on:
  schedule:
    - cron: '*/30 5-19 * * *'  # 8:00–22:30 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon httpx

      - name: Restore sent messages history
        run: |
          if [ -f sent_messages.json ]; then
            echo "✅ История загружена (размер: $(wc -l < sent_messages.json) строк)"
          else
            echo "[]" > sent_messages.json
            echo "🆕 Создан новый файл истории"
          fi

      - name: Run checker (DEBUG MODE)
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PACHCA_ACCESS_TOKEN: ${{ secrets.PACHCA_ACCESS_TOKEN }}
          PACHCA_CHAT_ID: ${{ secrets.PACHCA_CHAT_ID }}
        run: |
          echo "📱 PHONE: ${PHONE:0:3}***"
          echo "🆔 API_ID: ${API_ID}"
          echo "🔐 API_HASH: ${API_HASH:0:5}***"
          python check_moscow.py

      - name: Save sent messages history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sent_messages.json"
          file_pattern: sent_messages.json
          push_options: "--force"
