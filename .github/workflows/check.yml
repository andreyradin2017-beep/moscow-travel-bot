name: Check Moscow Posts

on:
  schedule:
    - cron: '*/30 5-19 * * *'  # 8:00–22:30 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Restore sent messages history
        run: |
          if [ -f sent_messages.json ]; then
            echo "✅ История загружена."
          else
            echo "[]" > sent_messages.json
          fi

      - name: Run checker
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python check_moscow.py

      - name: Save sent messages history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sent_messages.json"
          file_pattern: sent_messages.json
