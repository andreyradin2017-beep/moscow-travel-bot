name: Check Moscow Posts

on:
  schedule:
        - cron: '*/30 5-19 * * *'  # 8:00–22:30 МСК
  workflow_dispatch:

permissions:
  contents: read  # теперь не нужно писать

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon

      - name: Run checker
        env:
          PHONE: ${{ secrets.PHONE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python check_moscow.py
